# Chi3-labs monorepo compose file.
# From the repository root:
#   docker compose up --build
#
# Hub:               http://localhost:8080
# Physics lab:       http://localhost:8080/physics/
# Analog lab:        http://localhost:8080/analog/
# Handwriting lab:   http://localhost:8080/handwriting/
# Dogfight lab:      http://localhost:8080/dogfight/
# Swarm lab:         http://localhost:8080/swarm/
# Wave lab:          http://localhost:8080/waves/

services:
  nonlinear-physics-lab:
    build:
      context: ./apps/nonlinear-physics-lab
    expose:
      - "8080"
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
      PORT: "8080"

  analog-chi3-lab:
    build:
      context: ./apps/analog-chi3-lab
    expose:
      - "8080"
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
      PORT: "8080"

  handwriting-ai-lab:
    build:
      context: ./apps/handwriting-ai-lab
    expose:
      - "8081"
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
      PORT: "8081"
      HANDWRITING_DATA: /data
    volumes:
      - handwriting-brains:/data

  dogfight-ai-lab:
    build:
      context: ./apps/dogfight-ai-lab
    expose:
      - "8082"
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
      PORT: "8082"

  wave-rider-lab:
    build:
      context: ./apps/wave-rider-lab
    expose:
      - "8080"
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
      PORT: "8080"

  swarm-memory-lab:
    build:
      context: ./apps/swarm-memory-lab
    expose:
      - "8083"
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
      PORT: "8083"

  proxy:
    build:
      context: ./proxy
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      PORT: "8080"
      PHYSICS_UPSTREAM: nonlinear-physics-lab:8080
      ANALOG_UPSTREAM: analog-chi3-lab:8080
      HANDWRITING_UPSTREAM: handwriting-ai-lab:8081
      DOGFIGHT_UPSTREAM: dogfight-ai-lab:8082
      WAVE_UPSTREAM: wave-rider-lab:8080
      SWARM_UPSTREAM: swarm-memory-lab:8083
    depends_on:
      - nonlinear-physics-lab
      - analog-chi3-lab
      - handwriting-ai-lab
      - dogfight-ai-lab
      - wave-rider-lab
      - swarm-memory-lab

volumes:
  handwriting-brains:
