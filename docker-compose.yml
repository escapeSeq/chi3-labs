# Chi3-labs monorepo compose file.
# From the repository root:
#   docker compose up --build
#
# Hub:               http://localhost:8080
# Analog lab:        http://localhost:8080/analog/
# Handwriting lab:   http://localhost:8080/handwriting/
# Dogfight lab:      http://localhost:8080/dogfight/
# Wave lab:          http://localhost:8080/waves/

services:
  analog-chi3-lab:
    build:
      context: ./apps/analog-chi3-lab
    expose:
      - "8080"
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
      PORT: "8080"

  handwriting-ai-lab:
    build:
      context: ./apps/handwriting-ai-lab
    expose:
      - "8081"
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
      PORT: "8081"

  dogfight-ai-lab:
    build:
      context: ./apps/dogfight-ai-lab
    expose:
      - "8082"
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
      PORT: "8082"
      DOGFIGHT_DATA: /data
    volumes:
      - dogfight-brains:/data

  wave-rider-lab:
    build:
      context: ./apps/wave-rider-lab
    expose:
      - "8083"
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
      PORT: "8083"

  proxy:
    build:
      context: ./proxy
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      PORT: "8080"
      ANALOG_UPSTREAM: analog-chi3-lab:8080
      HANDWRITING_UPSTREAM: handwriting-ai-lab:8081
      DOGFIGHT_UPSTREAM: dogfight-ai-lab:8082
      WAVE_UPSTREAM: wave-rider-lab:8083
    depends_on:
      - analog-chi3-lab
      - handwriting-ai-lab
      - dogfight-ai-lab
      - wave-rider-lab

volumes:
  dogfight-brains:
